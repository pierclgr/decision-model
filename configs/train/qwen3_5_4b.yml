# lora training of qwen3.5-4b on kev-vision (h100, bf16)
# hyperparameters are starting points, not tuned
backbone: Qwen/Qwen3.5-4B
seed: 42
# resume from a Trainer checkpoint, e.g. runs/<run>/checkpoint-<step>
checkpoint: null

lora:
  r: 16
  alpha: 32

data:
  dataset: Jacqkues/kev-vision-decisions-full
  train: train
  validation: validation

# any hf TrainingArguments key; num_epochs is num_train_epochs,
# logging_steps defaults to 1 (every weight update)
training:
  output_dir: runs/qwen3_5_4b
  num_epochs: 1
  learning_rate: 5.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 0.1
  per_device_train_batch_size: 64
  per_device_eval_batch_size: 64
  gradient_accumulation_steps: 8
  bf16: true
  gradient_checkpointing: true
  # parallel batch preparation: one process is too slow on RunPod's CPUs
  dataloader_num_workers: 16
  eval_strategy: epoch
  # about 290 steps per epoch: a checkpoint every ~5%, the last 2 kept
  save_strategy: steps
  save_steps: 15
  save_total_limit: 2
  report_to: tensorboard

# fit: the global temperature on `split` of the training records, carved out
# before training (seeded with the run seed); or a fixed number
calibration:
  temperature: fit
  split: 0.1

modal:
  gpu: H100

runpod:
  gpu: NVIDIA H100 80GB HBM3
