# standalone calibration of the trained qwen3_5_0_8b model on kev-vision
# seed, data and calibration.split must match configs/train/qwen3_5_0_8b.yml
model: runs/qwen3_5_0_8b/final
seed: 42

data:
  dataset: Jacqkues/kev-vision-decisions-full
  train: train

# fit: on the calibration set carved out of data.train; or a fixed number
calibration:
  temperature: fit
  split: 0.1

# any hf TrainingArguments key, for the prediction run
calibrating:
  output_dir: runs/qwen3_5_0_8b/calibration
  per_device_eval_batch_size: 8
  bf16: true
  report_to: none

modal:
  gpu: H100
