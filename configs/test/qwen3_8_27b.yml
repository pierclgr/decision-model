# test of the trained qwen3_8_27b model on kev-vision
model: runs/qwen3_8_27b/final

data:
  dataset: Jacqkues/kev-vision-decisions-full
  split: test

# any hf TrainingArguments key; output_dir gets test_metrics.json
testing:
  output_dir: runs/qwen3_8_27b/test
  per_device_eval_batch_size: 4
  bf16: true
  report_to: none

modal:
  gpu: H100

runpod:
  gpu: NVIDIA H100 80GB HBM3
