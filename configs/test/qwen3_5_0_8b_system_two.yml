# system two test of the trained qwen3_5_0_8b model on kev-vision
model: runs/qwen3_5_0_8b/final

data:
  dataset: Jacqkues/kev-vision-decisions-full
  split: test

# any hf TrainingArguments key; output_dir gets test_metrics.json
testing:
  output_dir: runs/qwen3_5_0_8b/test_system_two
  per_device_eval_batch_size: 64
  bf16: true
  report_to: none

# the model generates its answer; thinking: off, low, medium or xhigh
system_two:
  thinking: off

modal:
  gpu: H200
