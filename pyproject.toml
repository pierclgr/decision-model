[project]
name = "decision-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.15.0",
    "pillow>=12.3.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
